<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141818" />
      <stop offset="100%" stop-color="#080A0A" />
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B7FF00" />
      <stop offset="100%" stop-color="#8DFF3F" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)" stroke="#222828" stroke-width="2"/>
  <!-- Clipboard Board -->
  <rect x="28" y="32" width="72" height="78" rx="10" fill="#111414" stroke="#333A38" stroke-width="3"/>
  <!-- Clipboard Clip top -->
  <rect x="44" y="20" width="40" height="18" rx="6" fill="#1C2220" stroke="url(#neon)" stroke-width="2.5" filter="url(#glow)"/>
  <circle cx="64" cy="29" r="3.5" fill="#B7FF00"/>
  <!-- Document inside -->
  <rect x="38" y="44" width="52" height="56" rx="5" fill="#191E1C" stroke="#2D3532" stroke-width="1.5"/>
  <!-- Content lines -->
  <rect x="46" y="54" width="36" height="4" rx="2" fill="#58625E"/>
  <rect x="46" y="63" width="26" height="4" rx="2" fill="#58625E"/>
  <!-- Freedom check / lightning bolt accent -->
  <path d="M48 83 L57 91 L80 69" fill="none" stroke="url(#neon)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
</svg>